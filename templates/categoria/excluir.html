{% extends 'base.html' %}

{% block content %}

<h2>Excluir categoria</h2>

<p>Tem certeza que deseja excluir a categoria "{{ categoria.nome }}"?</p>

<p>A categoria pode estar vinculada a notícias.</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Confirmar exclusão</button>
</form>

<a href="{% url 'core:categorias' %}">Cancelar</a>

{% endblock %}
